<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Romaneio - Fazendas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/sidebar.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="table-header">
                <h2>Gerenciar Fazendas</h2>
            </div>
            <form id="fazenda-form">
                <input type="hidden" id="fazenda-id">
                <div class="form-section form-grid" style="background: #ffffffd5; padding: 1.5rem; border: 1px solid #0c2559; border-radius: 8px; margin-bottom: 2rem;">
                    <div class="form-group">
                        <label>Nome da Fazenda</label>
                        <input type="text" id="fazenda-name" required placeholder="Ex: Fazenda Santa Maria">
                    </div>
                    <div class="form-group">
                        <label>Endereço</label>
                        <input type="text" id="fazenda-address" placeholder="Localização...">
                    </div>
                    <div class="form-actions" style="align-self: flex-end;">
                         <button type="submit" class="btn-primary">Salvar</button>
                         <button type="button" onclick="resetForm()" class="btn-cancel">Cancelar</button>
                    </div>
                </div>
            </form>

            <div class="table-container">
                <table id="fazendas-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Endereço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('fazenda-form');
        const tableBody = document.querySelector('#fazendas-table tbody');

        async function loadFazendas() {
            const res = await fetch('/api/fazendas');
            const data = await res.json();
            tableBody.innerHTML = data.map(f => `
                <tr>
                    <td>${f.id}</td>
                    <td>${escapeHtml(f.name)}</td>
                    <td>${escapeHtml(f.address) || '-'}</td>
                    <td>
                        <button data-id="${f.id}" data-name="${escapeHtml(f.name)}" data-address="${escapeHtml(f.address || '')}" onclick="editFazenda(Number(this.dataset.id), this.dataset.name, this.dataset.address)" style="color:var(--primary-color); background:none; border:none; cursor:pointer;">Editar</button>
                        <button onclick="confirmDeleteFazenda(${f.id})" style="color:red; background:none; border:none; cursor:pointer; margin-left:10px;">Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        // --- Notification & Modal Logic ---

        function showMessage(msg, type) {
            // Remove any existing message
            const existingMsg = document.querySelector('.success-message');
            if (existingMsg) {
                existingMsg.remove();
            }
            
            // Create new message
            const msgDiv = document.createElement('div');
            // type maps to: 'success' -> green, 'warning' -> yellow, 'error' -> red
            // Using toast-success, toast-warning (new), toast-error
            let className = 'success-message';
            if (type === 'success') className += ' toast-success';
            else if (type === 'warning') className += ' toast-warning';
            else if (type === 'error') className += ' toast-error';
            
            msgDiv.className = className;
            msgDiv.innerHTML = msg;
            
            document.body.appendChild(msgDiv);
            
            // Remove after 5 seconds
            setTimeout(() => {
                msgDiv.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => {
                    msgDiv.remove();
                }, 300);
            }, 5000);
        }

        function showConfirmModal(title, message, onConfirm) {
            const overlay = document.getElementById('confirmation-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            titleEl.textContent = title;
            bodyEl.textContent = message;

            // Show modal
            overlay.classList.add('active');

            // Handle Confirm
            const handleConfirm = () => {
                onConfirm();
                closeModal();
                cleanup();
            };

            // Handle Cancel
            const handleCancel = () => {
                closeModal();
                cleanup();
            };

            const cleanup = () => {
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
            };

            confirmBtn.addEventListener('click', handleConfirm);
            cancelBtn.addEventListener('click', handleCancel);
        }

        function closeModal() {
            document.getElementById('confirmation-modal').classList.remove('active');
        }

        // --- Event Listeners ---

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('fazenda-id').value;
            const name = document.getElementById('fazenda-name').value;
            const address = document.getElementById('fazenda-address').value;

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/fazendas/${id}` : '/api/fazendas';

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, address })
                });

                if (res.ok) {
                    resetForm();
                    loadFazendas();
                    if (id) {
                        showMessage('<span class="toast-title">Atenção</span>Registro alterado com sucesso!', 'warning');
                    } else {
                        showMessage('<span class="toast-title">Sucesso</span>Registro salvo com sucesso!', 'success');
                    }
                } else {
                    const err = await res.json();
                     showMessage(`<span class="toast-title">Erro</span>${err.error || 'Erro ao salvar'}`, 'error');
                }
            } catch (error) {
                console.error(error);
                showMessage(`<span class="toast-title">Erro</span>Erro de conexão`, 'error');
            }
        });

        window.editFazenda = (id, name, address) => {
            document.getElementById('fazenda-id').value = id;
            document.getElementById('fazenda-name').value = name;
            document.getElementById('fazenda-address').value = address;
        };

        window.confirmDeleteFazenda = (id) => {
            showConfirmModal(
                'Confirmação',
                'Deseja excluir o registro?',
                async () => {
                    try {
                        const res = await fetch(`/api/fazendas/${id}`, { method: 'DELETE' });
                        if(res.ok) {
                            loadFazendas();
                            showMessage('<span class="toast-title">Sucesso</span>Registro excluído com sucesso!', 'error'); // Red toast requested for delete success
                        } else {
                            showMessage('<span class="toast-title">Erro</span>Erro ao excluir registro', 'error');
                        }
                    } catch (error) {
                        console.error(error);
                        showMessage('<span class="toast-title">Erro</span>Erro de conexão', 'error');
                    }
                }
            );
        };

        window.resetForm = () => {
            document.getElementById('fazenda-id').value = '';
            form.reset();
        };

        loadFazendas();
    </script>
    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal-overlay">
        <div class="modal-container">
            <h3 class="modal-title" id="modal-title">Título</h3>
            <p class="modal-body" id="modal-body">Mensagem...</p>
            <div class="modal-actions">
                <button id="modal-cancel-btn" class="btn-cancel">Não</button>
                <button id="modal-confirm-btn" class="btn-primary">Sim</button>
            </div>
        </div>
    </div>

    <script src="js/header-utils.js"></script>
</body>
</html>
